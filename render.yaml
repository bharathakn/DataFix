# Render blueprint: New + > Blueprint > pick this repo. Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: datafix-api
    runtime: docker
    plan: free            # 512 MB RAM: fine for the demo (peak 225 MB); 30k-row files need a plan with >= 1 GB
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATAFIX_PUBLIC
        value: "1"
      - key: DATAFIX_SESSION_TTL_H
        value: "24"
      - key: DATAFIX_MAX_UPLOAD_MB
        value: "50"
      - key: DATAFIX_CORS_ORIGINS
        sync: false       # e.g. https://datafix.vercel.app
      - key: DATAFIX_CORS_ORIGIN_REGEX
        sync: false       # optional, e.g. https://datafix-.*\.vercel\.app (preview deployments)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false
      - key: GROQ_API_KEY
        sync: false
