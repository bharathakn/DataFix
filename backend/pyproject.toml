[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bharatha_K_N", email = "bharathakn49@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
